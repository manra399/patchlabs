<header class="app-header">
  <div class="wrap">
    <a class="logo" href="/app/" aria-label="PatchLabs app home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M11.5 9H8.5v14h3M20.5 9h3v14h-3" stroke="var(--bg)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6 16.4l2.5 2.5 4.4-5.2" stroke="var(--logo-check)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="hide-sm">PatchLabs</span></a>
    <div id="ws-slot"></div>
    <nav aria-label="App">
      <a href="/app/">Apps</a>
      <a href="/app/settings" aria-current="page">Settings</a>
      <a href="/docs" class="hide-sm">Docs</a>
    </nav>
    <div class="right">
      <button class="theme-toggle hide-sm" type="button" data-theme-toggle aria-label="Switch theme"><svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9L13 13M3 13l1.1-1.1M11.9 4.1L13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.7 5.7 0 0 1 6.2 2.5a5.7 5.7 0 1 0 7.3 7.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="t">Theme</span></button>
      <button class="btn small secondary" type="button" id="signout">Sign out</button>
    </div>
  </div>
</header>

<main id="main" class="app-main">
  <div class="wrap wide">
    <div class="app-head"><div><p class="lab">Settings</p><h1 class="app-title">Settings</h1><p class="app-sub" id="ws-line"><span class="skeleton" style="display:inline-block;width:220px;height:14px"></span></p></div></div>
    <div class="settings-layout">
      <nav class="settings-nav" aria-label="Settings sections">
        <a href="#profile">Profile</a><a href="#team">Team</a><a href="#keys">API keys</a><a href="#webhook">Webhook</a><a href="#plan">Plan &amp; usage</a><a href="#data">Your data</a><a href="#delete">Delete account</a>
      </nav>
      <div class="settings-main" id="sm" aria-live="polite">
        <div class="panel"><div class="skeleton sk-line" style="width:30%"></div><div class="skeleton sk-line mt-2" style="width:80%"></div><div class="skeleton sk-line mt-2" style="width:60%"></div></div>
        <div class="panel"><div class="skeleton sk-line" style="width:24%"></div><div class="skeleton sk-line mt-2" style="width:90%"></div></div>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var esc = PL.esc, $ = PL.$;
  var S = { me: null, ws: null, wsd: null, keys: [] };

  PL.boot({ onWorkspace: function (w) { S.ws = w; load(); } }).then(function (b) { S.me = b.me; S.ws = b.ws; load(); })
    .catch(function (e) { PL.errorBox($('sm'), e, function () { location.reload(); }); });

  async function load() {
    try {
      var r = await Promise.all([PL.call('/workspaces/' + S.ws.id), PL.call('/workspaces/' + S.ws.id + '/api-keys')]);
      S.wsd = r[0]; S.keys = r[1].api_keys;
      render();
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    } catch (e) { if (!e.redirecting) PL.errorBox($('sm'), e, load); }
  }

  var owner = function () { return S.wsd.role === 'owner'; };

  function render() {
    var w = S.wsd;
    $('ws-line').innerHTML = 'Workspace: <b class="ink">' + esc(w.name) + '</b> · ' + esc(PL.planName(w.plan)) + ' plan · you’re ' + (owner() ? 'an owner' : 'a member');
    $('sm').innerHTML = profile() + team() + keys() + webhook() + plan() + data() + del();
    wireProfile(); wireTeam(); wireKeys(); wireWebhook(); wirePlan(); wireData(); wireDelete();
  }

  /* ---- profile ---- */
  function profile() {
    var u = S.me.user;
    return '<section class="panel" id="profile" aria-labelledby="h-profile"><h2 id="h-profile">Profile</h2><p class="sec-sub">Your name appears on decisions you record on reports and in team lists.</p>' +
      '<dl class="kv mb-3"><dt>Email</dt><dd>' + esc(u.email) + '</dd><dt>Joined</dt><dd>' + esc(PL.date(u.created_at)) + '</dd></dl>' +
      '<form id="pf" class="form-row"><div class="field"><label for="p-name">Name</label><input id="p-name" maxlength="100" autocomplete="name" value="' + esc(u.name || '') + '" placeholder="Your name"></div><button class="btn secondary" type="submit" id="p-save">Save</button></form><p class="err" role="alert" id="p-err"></p></section>';
  }
  function wireProfile() {
    $('pf').addEventListener('submit', async function (e) {
      e.preventDefault(); var restore = PL.busy($('p-save'), 'Saving…'); $('p-err').textContent = '';
      try { var r = await PL.call('/me', { method: 'PATCH', body: { name: $('p-name').value.trim() } }); S.me.user = r.user; restore(); PL.toast('Name saved', 'ok'); }
      catch (x) { restore(); $('p-err').textContent = x.message; }
    });
  }

  /* ---- team ---- */
  function team() {
    var w = S.wsd, me = S.me.user.id, isOwner = owner();
    var seatsLeft = w.limits.seats - w.usage.members - w.invites.length;
    var rows = w.members.map(function (m) {
      var self = m.user_id === me;
      return '<tr data-uid="' + esc(m.user_id) + '"><th scope="row">' + esc(m.name || m.email) + (self ? '<span class="tag">you</span>' : '') + (m.name ? '<div class="small muted" style="font-weight:400">' + esc(m.email) + '</div>' : '') + '</th>' +
        '<td data-label="Role">' + (isOwner ? '<label class="sr-only" for="r-' + esc(m.user_id) + '">Role for ' + esc(m.email) + '</label><select class="input" id="r-' + esc(m.user_id) + '" data-role><option value="member"' + (m.role === 'member' ? ' selected' : '') + '>Member</option><option value="owner"' + (m.role === 'owner' ? ' selected' : '') + '>Owner</option></select>' : esc(m.role === 'owner' ? 'Owner' : 'Member')) + '</td>' +
        '<td data-label="Joined">' + esc(PL.date(m.joined_at)) + '</td>' +
        '<td class="acts">' + (isOwner && !self ? '<button class="btn small danger" type="button" data-remove>Remove</button>' : self && !isOwner ? '<button class="btn small secondary" type="button" data-remove>Leave</button>' : '') + '</td></tr>';
    }).join('');
    var inv = w.invites.length ? '<h3 class="h4 mt-4 mb-1">Pending invites</h3><div class="table-wrap"><table class="table compact stack-sm"><thead><tr><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Expires</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>' +
      w.invites.map(function (i) {
        return '<tr data-iid="' + esc(i.id) + '"><th scope="row">' + esc(i.email) + '</th><td data-label="Role">' + (i.role === 'owner' ? 'Owner' : 'Member') + '</td><td data-label="Expires">' + esc(PL.date(i.expires_at)) + '</td><td class="acts">' + (isOwner ? '<button class="btn small ghost" type="button" data-revoke-inv>Revoke</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '';
    var form = isOwner ? (seatsLeft > 0
      ? '<h3 class="h4 mt-4 mb-1">Invite someone</h3><p class="small muted">They get an email with a join link that lasts 14 days. ' + PL.plural(seatsLeft, 'seat') + ' left on the ' + esc(PL.planName(w.plan)) + ' plan.</p>' +
        '<form id="if" class="form-row" novalidate><div class="field"><label for="i-email">Email</label><input id="i-email" type="email" autocomplete="off" placeholder="teammate@company.com"></div><div class="field narrow"><label for="i-role">Role</label><select id="i-role"><option value="member">Member</option><option value="owner">Owner</option></select></div><button class="btn secondary" type="submit" id="i-go">Send invite</button></form><p class="err" role="alert" id="i-err"></p>'
      : '<div class="callout limit mt-3"><p>All ' + PL.plural(w.limits.seats, 'seat') + ' on the ' + esc(PL.planName(w.plan)) + ' plan are taken or invited. <a href="#plan">Request an upgrade</a> for more.</p></div>')
      : '<p class="small muted mt-3 mb-0">Only owners can invite people or change roles.</p>';
    return '<section class="panel" id="team" aria-labelledby="h-team"><h2 id="h-team">Team</h2><p class="sec-sub">Everyone here can see and run this workspace’s apps. Owners also manage people, the webhook and the workspace name.</p>' +
      (isOwner ? '<form id="wf" class="form-row mb-3"><div class="field"><label for="w-name">Workspace name</label><input id="w-name" maxlength="100" value="' + esc(w.name) + '"></div><button class="btn secondary" type="submit" id="w-save">Rename</button></form>' : '') +
      '<div class="table-wrap"><table class="table compact stack-sm"><thead><tr><th scope="col">Member</th><th scope="col">Role</th><th scope="col">Joined</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="err" role="alert" id="t-err"></p>' + inv + form + '</section>';
  }
  function wireTeam() {
    var wid = S.ws.id;
    if ($('wf')) $('wf').addEventListener('submit', async function (e) {
      e.preventDefault(); var restore = PL.busy($('w-save'), 'Saving…');
      try {
        S.wsd = await PL.call('/workspaces/' + wid, { method: 'PATCH', body: { name: $('w-name').value.trim() } });
        PL.toast('Workspace renamed', 'ok');
        var me = await PL.call('/me'); PL.mountSwitcher(me, me.workspaces.filter(function (x) { return x.id === wid; })[0], function (w) { S.ws = w; load(); });
        render();
      } catch (x) { restore(); $('t-err').textContent = x.message; }
    });
    document.querySelectorAll('[data-role]').forEach(function (sel) {
      var prev = sel.value;
      sel.addEventListener('change', async function () {
        var uid = sel.closest('tr').dataset.uid; sel.disabled = true; $('t-err').textContent = '';
        try { S.wsd = await PL.call('/workspaces/' + wid + '/members/' + uid, { method: 'PATCH', body: { role: sel.value } }); PL.toast('Role updated', 'ok'); render(); }
        catch (x) { sel.value = prev; sel.disabled = false; $('t-err').textContent = x.message; }
      });
    });
    document.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var uid = b.closest('tr').dataset.uid, self = uid === S.me.user.id;
        var m = S.wsd.members.filter(function (x) { return x.user_id === uid; })[0];
        var ok = await PL.confirm(self
          ? { title: 'Leave ' + S.wsd.name + '?', text: '<p>You’ll lose access to its apps and reports. An owner can invite you again.</p>', confirm: 'Leave workspace', danger: true }
          : { title: 'Remove ' + (m.name || m.email) + '?', text: '<p>They lose access to this workspace’s apps and reports straight away. Their account stays.</p>', confirm: 'Remove', danger: true });
        if (!ok) return;
        var restore = PL.busy(b, '…'); $('t-err').textContent = '';
        try {
          await PL.call('/workspaces/' + wid + '/members/' + uid, { method: 'DELETE' });
          if (self) { PL.store.del('pl_ws'); location.href = '/app/'; return; }
          PL.toast('Removed', 'ok'); load();
        } catch (x) { restore(); $('t-err').textContent = x.message; }
      });
    });
    document.querySelectorAll('[data-revoke-inv]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var iid = b.closest('tr').dataset.iid, restore = PL.busy(b, '…');
        try { await PL.call('/workspaces/' + wid + '/invites/' + iid, { method: 'DELETE' }); PL.toast('Invite revoked', 'ok'); load(); }
        catch (x) { restore(); $('t-err').textContent = x.message; }
      });
    });
    if ($('if')) $('if').addEventListener('submit', async function (e) {
      e.preventDefault(); var email = $('i-email').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('i-err').textContent = 'Enter a valid email address.'; $('i-email').focus(); return; }
      var restore = PL.busy($('i-go'), 'Sending…'); $('i-err').textContent = '';
      try { await PL.call('/workspaces/' + wid + '/invites', { method: 'POST', body: { email: email, role: $('i-role').value } }); PL.toast('Invite sent to ' + email, 'ok'); load(); }
      catch (x) { restore(); $('i-err').textContent = x.message; }
    });
  }

  /* ---- API keys ---- */
  function keys() {
    var rows = S.keys.map(function (k) {
      return '<tr data-kid="' + esc(k.id) + '"><th scope="row">' + esc(k.name) + '</th><td data-label="Key"><code>' + esc(k.prefix) + '…</code></td><td data-label="Created">' + esc(PL.date(k.created_at)) + '</td><td data-label="Last used">' + (k.last_used_at ? esc(PL.rel(k.last_used_at)) : '<span class="muted">Never</span>') + '</td><td class="acts"><button class="btn small danger" type="button" data-revoke-key>Revoke</button></td></tr>';
    }).join('');
    return '<section class="panel" id="keys" aria-labelledby="h-keys"><h2 id="h-keys">API keys</h2><p class="sec-sub">Start checks from CI and read results. Keys belong to this workspace and work on every plan. See the <a href="/docs/api">API docs</a>.</p>' +
      (S.keys.length ? '<div class="table-wrap"><table class="table compact stack-sm"><thead><tr><th scope="col">Name</th><th scope="col">Key</th><th scope="col">Created</th><th scope="col">Last used</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty small"><p>No API keys yet.</p></div>') +
      '<form id="kf" class="form-row mt-3"><div class="field"><label for="k-name">New key name</label><input id="k-name" maxlength="100" autocomplete="off" placeholder="e.g. GitHub Actions"></div><button class="btn secondary" type="submit" id="k-go">Create key</button></form><p class="err" role="alert" id="k-err"></p><div id="k-once"></div></section>';
  }
  function wireKeys() {
    var wid = S.ws.id;
    $('kf').addEventListener('submit', async function (e) {
      e.preventDefault(); var name = $('k-name').value.trim();
      if (!name) { $('k-err').textContent = 'Give the key a name so you know where it’s used.'; $('k-name').focus(); return; }
      var restore = PL.busy($('k-go'), 'Creating…'); $('k-err').textContent = '';
      try {
        var k = await PL.call('/workspaces/' + wid + '/api-keys', { method: 'POST', body: { name: name } });
        S.keys.push(k); render();
        $('k-once').innerHTML = '<div class="key-once" role="status"><p class="mb-0"><strong class="ink">Copy your new key “' + esc(k.name) + '” now.</strong> We store only a hash, so you won’t see it again.</p>' +
          '<code class="k" id="k-full">' + esc(k.key) + '</code><div class="row"><button class="btn small primary" type="button" data-copy="#k-full">Copy key</button>' +
          '<span class="small muted">Use it as <code>X-API-Key</code>, e.g. <code>curl -X POST ' + esc(API) + '/v1/apps/&lt;app id&gt;/checks -H "X-API-Key: …"</code></span></div></div>';
        $('k-once').scrollIntoView({ block: 'nearest' });
      } catch (x) { restore(); $('k-err').textContent = x.message; }
    });
    document.querySelectorAll('[data-revoke-key]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var kid = b.closest('tr').dataset.kid, k = S.keys.filter(function (x) { return x.id === kid; })[0];
        var ok = await PL.confirm({ title: 'Revoke “' + k.name + '”?', text: '<p>Anything using <code>' + esc(k.prefix) + '…</code> stops working immediately. This can’t be undone.</p>', confirm: 'Revoke key', danger: true });
        if (!ok) return;
        var restore = PL.busy(b, '…');
        try { await PL.call('/workspaces/' + wid + '/api-keys/' + kid, { method: 'DELETE' }); S.keys = S.keys.filter(function (x) { return x.id !== kid; }); render(); PL.toast('Key revoked', 'ok'); }
        catch (x) { restore(); $('k-err').textContent = x.message; }
      });
    });
  }

  /* ---- webhook ---- */
  function webhook() {
    var w = S.wsd, isOwner = owner();
    var secret = isOwner && w.webhook_secret
      ? '<div class="form-row mt-3"><div class="field"><label for="h-secret">Signing secret</label><input id="h-secret" class="mono" readonly spellcheck="false" autocomplete="off" value="' + esc(w.webhook_secret) + '"></div>' +
        '<button class="btn secondary" type="button" data-copy data-copy-text="' + esc(w.webhook_secret) + '">Copy secret</button><button class="btn ghost" type="button" id="h-rotate">Rotate</button></div>' +
        '<p class="small muted mb-0">Every request carries <code>X-PatchLabs-Timestamp</code> and <code>X-PatchLabs-Signature</code>, an HMAC-SHA256 of the timestamp and body made with this secret. <a href="/docs/webhooks#security">How to verify it</a>.</p>'
      : '';
    return '<section class="panel" id="webhook" aria-labelledby="h-hook"><h2 id="h-hook">Webhook</h2><p class="sec-sub">We POST signed JSON here when an app check finishes. The <code>text</code> field makes it work as a Slack incoming webhook. HTTPS and public hosts only.</p>' +
      '<form id="hf" class="form-row" novalidate><div class="field"><label for="h-url">Webhook URL</label><input id="h-url" class="mono" type="url" autocomplete="off" spellcheck="false" placeholder="https://hooks.slack.com/services/…" value="' + esc(w.webhook_url || '') + '"' + (isOwner ? '' : ' readonly') + '></div>' +
      (isOwner ? '<button class="btn secondary" type="submit" id="h-save">Save</button>' : '') + '<button class="btn ghost" type="button" id="h-test"' + (w.webhook_url ? '' : ' disabled') + '>Send test</button></form>' +
      '<p class="err" role="alert" id="h-err"></p><p id="h-res" class="small mb-0" role="status"></p>' + secret +
      (isOwner ? '' : '<p class="small muted mt-2 mb-0">Only owners can change the webhook or see its signing secret.</p>') + '</section>';
  }
  function wireWebhook() {
    var wid = S.ws.id;
    if ($('hf')) $('hf').addEventListener('submit', async function (e) {
      e.preventDefault(); if (!$('h-save')) return;
      var restore = PL.busy($('h-save'), 'Saving…'); $('h-err').textContent = ''; $('h-res').textContent = '';
      try {
        S.wsd = await PL.call('/workspaces/' + wid, { method: 'PATCH', body: { webhook_url: $('h-url').value.trim() } });
        PL.toast(S.wsd.webhook_url ? 'Webhook saved' : 'Webhook removed', 'ok'); render();  /* shows the signing secret after the first save */
      } catch (x) { restore(); $('h-err').textContent = x.message; }
    });
    if ($('h-rotate')) $('h-rotate').addEventListener('click', async function () {
      var b = this;
      var ok = await PL.confirm({ title: 'Rotate the signing secret?', text: '<p>The current secret stops working straight away. Put the new one in your endpoint, or it will reject PatchLabs requests.</p>', confirm: 'Rotate secret', danger: true });
      if (!ok) return;
      var restore = PL.busy(b, 'Rotating…'); $('h-err').textContent = '';
      try { var r = await PL.call('/workspaces/' + wid + '/webhook/rotate-secret', { method: 'POST' }); S.wsd.webhook_secret = r.webhook_secret; render(); PL.toast('New signing secret created', 'ok'); }
      catch (x) { restore(); $('h-err').textContent = x.message; }
    });
    $('h-test').addEventListener('click', async function () {
      var restore = PL.busy(this, 'Sending…'); $('h-err').textContent = ''; $('h-res').textContent = '';
      try {
        var r = await PL.call('/workspaces/' + wid + '/webhook/test', { method: 'POST' });
        $('h-res').innerHTML = r.ok ? '<span class="pill proven">HTTP ' + esc(r.status_code) + '</span> <span class="muted">Test event delivered.</span>'
          : '<span class="pill leak">' + (r.status_code ? 'HTTP ' + esc(r.status_code) : 'no response') + '</span> <span class="muted">' + esc(r.detail || 'Your endpoint didn’t accept the test event.') + '</span>';
      } catch (x) { $('h-err').textContent = x.message; }
      restore();
    });
  }

  /* ---- plan & usage ---- */
  function plan() {
    var w = S.wsd, u = w.usage, l = w.limits;
    var opts = [['maker', 'Maker: £19 a month, 3 apps, weekly re-checks, 2 seats'], ['agency', 'Agency: £99 a month, 10 apps (+£8 per extra), 10 seats'], ['enterprise', 'Enterprise: custom limits']]
      .filter(function (o) { return o[0] !== w.plan; });
    return '<section class="panel" id="plan" aria-labelledby="h-plan"><h2 id="h-plan">Plan &amp; usage</h2><p class="sec-sub">Card payments aren’t live yet: ask for a plan below and we set it up, usually within a day.</p>' +
      '<dl class="kv mb-3"><dt>Plan</dt><dd><span class="pill plain">' + esc(PL.planName(w.plan)) + '</span></dd><dt>Apps</dt><dd>' + u.apps + ' of ' + l.apps + '</dd><dt>Manual runs this month</dt><dd>' + u.runs_this_month + ' of ' + l.runs_per_month + '</dd>' +
      '<dt>Team seats</dt><dd>' + u.members + ' of ' + l.seats + '</dd><dt>Re-check schedules</dt><dd>' + l.schedules.filter(function (s) { return s !== 'off'; }).map(function (s) { return PL.SCHEDULES[s]; }).join(', ') + '</dd></dl>' +
      (opts.length ? '<h3 class="h4 mb-1">Request an upgrade</h3><form id="uf"><div class="field"><label for="u-plan">Plan</label><select id="u-plan">' + opts.map(function (o) { return '<option value="' + o[0] + '">' + esc(o[1]) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="u-note">Anything we should know? <span class="muted" style="font-weight:400">(optional)</span></label><textarea id="u-note" maxlength="2000" placeholder="e.g. how many apps you need, or a billing contact"></textarea></div>' +
        '<button class="btn primary" type="submit" id="u-go">Request upgrade</button><p class="err" role="alert" id="u-err"></p></form>' : '<p class="small muted mb-0">You’re on our largest plan. Email <a href="mailto:manraj@patchlabs.dev">manraj@patchlabs.dev</a> to change your limits.</p>') + '</section>';
  }
  function wirePlan() {
    if (!$('uf')) return;
    $('uf').addEventListener('submit', async function (e) {
      e.preventDefault(); var restore = PL.busy($('u-go'), 'Sending…'); $('u-err').textContent = '';
      try {
        var note = $('u-note').value.trim();
        var r = await PL.call('/workspaces/' + S.ws.id + '/upgrade-request', { method: 'POST', body: note ? { plan: $('u-plan').value, note: note } : { plan: $('u-plan').value } });
        $('uf').outerHTML = '<div class="callout ok" role="status"><p><strong>Request sent for ' + esc(PL.planName(r.plan)) + '.</strong> ' + esc(r.detail || 'We’ll reply within a day.') + '</p></div>';
      } catch (x) { restore(); $('u-err').textContent = x.message; }
    });
  }

  /* ---- data export ---- */
  function data() {
    return '<section class="panel" id="data" aria-labelledby="h-data"><h2 id="h-data">Your data</h2><p class="sec-sub">Download everything we hold about you as JSON: your account, sessions, workspaces, apps, checks you started, keys you created and decisions you recorded.</p>' +
      '<button class="btn secondary" type="button" id="exp">Download my data (JSON)</button><p class="err" role="alert" id="x-err"></p></section>';
  }
  function wireData() {
    $('exp').addEventListener('click', async function () {
      var restore = PL.busy(this, 'Preparing…'); $('x-err').textContent = '';
      try {
        var r = await api('/me/export', { raw: true });
        if (r.status === 401) { session.clear(); PL.toLogin(); return; }
        if (!r.ok) throw new Error('We couldn’t prepare your export. Try again.');
        PL.download(await r.blob(), 'patchlabs-export.json'); PL.toast('Export downloaded', 'ok');
      } catch (x) { $('x-err').textContent = x.message; }
      restore();
    });
  }

  /* ---- delete account ---- */
  function del() {
    return '<section class="panel danger-zone" id="delete" aria-labelledby="h-del"><h2 id="h-del">Delete account</h2>' +
      '<p class="sec-sub">This deletes your account, your sessions and the one-off checks you started. Workspaces where you are the only member are deleted with their apps, checks and API keys. In shared workspaces your teammates keep everything, and the longest-standing member becomes owner if you were the only one. Decisions you recorded on reports stay, signed as “a former member”.</p>' +
      '<div class="form-row"><div class="field"><label for="d-type">Type <code>DELETE</code> to confirm</label><input id="d-type" class="mono" autocomplete="off" spellcheck="false"></div><button class="btn danger" type="button" id="d-go" disabled>Delete my account</button></div><p class="err" role="alert" id="d-err"></p></section>';
  }
  function wireDelete() {
    $('d-type').addEventListener('input', function () { $('d-go').disabled = this.value.trim() !== 'DELETE'; });
    $('d-go').addEventListener('click', async function () {
      var restore = PL.busy(this, 'Deleting…'); $('d-err').textContent = '';
      try { await PL.call('/me', { method: 'DELETE' }); session.clear(); PL.store.del('pl_ws'); location.href = '/app/login?deleted=1'; }
      catch (x) { restore(); $('d-err').textContent = x.message; }
    });
  }
})();
</script>

</body>
</html>
